<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimoine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9EEE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://api.mistral.ai; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Patrimoine</title>
<style>
:root{
  --paper:#E9EEE8; --surface:#F7F9F5; --ink:#15201A; --muted:#5A675F; --line:#D1DAD2;
  --pine:#1E5540; --on-pine:#FFFFFF; --pine-soft:#DAE7DE;
  --amber:#9C6116; --amber-soft:#F2E4CB; --red:#A6423A; --red-soft:#F6DCD8;
  --c-livrets:#9DC1A7; --c-bourse:#1E5540; --c-av:#4F8B6D; --c-retraite:#B38B3F; --c-salariale:#5E7F8C; --c-courant:#8C7A5E;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --txt: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1512; --surface:#17211C; --ink:#E4ECE6; --muted:#8FA096; --line:#28352E;
    --pine:#7DC4A0; --on-pine:#0E1512; --pine-soft:#1B2E24;
    --amber:#E2AB58; --amber-soft:#33291A; --red:#E47D72; --red-soft:#3A2220;
    --c-livrets:#3E6B51; --c-bourse:#7DC4A0; --c-av:#4F9C76; --c-retraite:#C9A45A; --c-salariale:#7FA2B0; --c-courant:#B09A7F;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--txt);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.num{font-family:var(--num)}

/* Verrou */
.lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(32px + var(--safe-t)) 28px calc(32px + var(--safe-b));max-width:440px;margin:0 auto}
.lock-mark svg{width:56px;height:56px}
.lock-title{font:700 34px/1.1 var(--num);letter-spacing:-.02em;margin:18px 0 10px}
.lock-text{color:var(--muted);margin:0 0 26px;max-width:36ch}
.lock-form{display:grid;gap:14px}
.lock-links{display:grid;gap:4px;margin-top:22px;justify-items:start}
.err{color:var(--red);margin:0;font-size:15px}
.codebar{padding:calc(12px + var(--safe-t)) 18px 14px;background:var(--amber-soft);font-size:14px;line-height:1.4}
.codebar.bad{background:var(--red-soft)}
.codebar p{margin:0 0 10px}
.codebar .row{display:flex;gap:8px;flex-wrap:wrap}
.codebar .btn{min-height:38px;font-size:15px;background:var(--surface)}
.codebar .btn.primary{background:var(--pine);color:var(--on-pine)}
.fp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.04em}
.or{text-align:center;color:var(--muted);margin:14px 0;font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.note{margin-top:28px;padding:12px 14px;border-radius:12px;background:var(--amber-soft);color:var(--ink);font-size:14px}

/* Champs */
label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
textarea{width:100%;padding:10px 12px;font:16px/1.4 var(--txt);border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);-webkit-appearance:none;resize:vertical}
input[type=text],input[type=password],input[type=month],input:not([type]),select{width:100%;min-height:46px;padding:10px 12px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=month]{display:block}
input.bad{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.check{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--ink);padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--pine);margin:0}

/* Boutons */
.btn{border:0;border-radius:14px;min-height:46px;padding:0 18px;font-weight:600;background:var(--pine-soft);color:var(--ink)}
.btn.primary{background:var(--pine);color:var(--on-pine)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.55}
.link{background:none;border:0;padding:8px 0;color:var(--pine);font-weight:600;text-align:left}
.inline{background:none;border:0;padding:0;color:var(--pine);font-weight:600;font-size:inherit;text-decoration:underline}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.on{background:var(--pine-soft);color:var(--pine)}

/* Structure */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 16px 8px 20px;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top h1{font:700 22px/1.2 var(--num);margin:0;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn.back{margin:0 4px 0 -8px;flex:0 0 auto}
.top-actions{display:flex;align-items:center;gap:2px}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--amber-soft);color:var(--amber);margin-right:4px}
.view{padding:4px 20px calc(110px + var(--safe-b));max-width:560px;margin:0 auto}
.view section{margin-top:30px}
.view h2{font:650 18px/1.3 var(--num);margin:0 0 12px}
.banner{margin:0 16px;padding:10px 14px;border-radius:12px;background:var(--amber-soft);font-size:14px}

/* Accueil */
.hero{margin-top:14px !important}
.hero-month{margin:0;color:var(--muted);font-size:15px}
.hero-total{margin:2px 0 4px;font:700 46px/1.05 var(--num);letter-spacing:-.025em}
.hero-delta{margin:0;font-size:15px;font-weight:600}
.up{color:var(--pine)} .down{color:var(--red)}
.update{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 16px 16px 18px;border-radius:20px;background:var(--pine-soft)}
.update.done{background:transparent;border:1px solid var(--line)}
.update p{margin:0}
.update .btn{white-space:nowrap;flex-shrink:0}
.update-title{font-weight:650}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px;width:140px}
.progress i{display:block;height:100%;background:var(--pine);border-radius:9px}
.chips.tight{margin-top:0}
.chips{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 15px;font-size:14px;font-weight:600}
.chips button.on{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:14px;padding:4px;margin-top:14px}
.seg button{border:0;background:none;border-radius:11px;padding:9px 0;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--pine);color:var(--on-pine)}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
.seg.seg3 button{font-size:14px}
.acctlist{display:grid;gap:2px}
.acctrow{width:100%;display:flex;align-items:center;gap:12px;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit}
.acctrow:last-child{border-bottom:0}
.arow-main{flex:1;display:grid;gap:2px;min-width:0}
.arow-n{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow-main .small,.arow-v .small{color:var(--muted);font-size:13px}
.arow-v{text-align:right;display:grid;gap:2px;flex:0 0 auto}
.arow-v .num{font:650 16px var(--num)}
.acct{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}
.acct header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.acct h3{font:650 17px var(--num);margin:0 0 2px}
.acct .small{margin:0;color:var(--muted);font-size:13px}
.acct-v{text-align:right;display:grid;gap:2px}
.acct-v .num{font:650 19px var(--num)}
.bar.sm{height:6px;margin:12px 0 6px}
.kv{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv li:last-child{border-bottom:0}
.kv li span:first-child{color:var(--muted)}
.lines{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.lines ul{list-style:none;margin:8px 0 0;padding:0}
.lines li{display:grid;grid-template-columns:1fr 46px 38px auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.lines .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lines .lb{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.lines .lb i{display:block;height:100%;background:var(--c-bourse);border-radius:9px}
.lines .lp{color:var(--muted);text-align:right;font-size:13px}
.txlist{list-style:none;margin:0;padding:0}
.txrow{padding:10px 0;border-bottom:1px solid var(--line)}
.txmain{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.txn{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txsub{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.seg.mini{margin:0;padding:3px;gap:3px}
.seg.mini button{font-size:13px;padding:6px 10px;white-space:nowrap}
.txrow.cred{opacity:.65}
.tbl{overflow-x:auto;margin-top:14px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:6px 0 6px 10px;font-size:13px}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{text-align:right;padding:8px 0 8px 10px;border-top:1px solid var(--line)}
.settle{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.settle p{margin:0 0 10px}
.mrow{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px;display:grid;gap:10px}
.effort li{display:grid;gap:2px}
.effort li span:last-child{color:var(--ink);font-size:13.5px}
.linehint{margin:2px 0 0;font-size:13px}
.linehint .check{padding:2px 0;font-size:14px}
.linehint .muted{font-size:13px}
.bullets{margin:10px 0 0;padding-left:20px;font-size:14.5px}
.bullets li{margin:7px 0}
.ech{list-style:none;margin:0;padding:0}
.ech li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border-left:4px solid var(--line);margin-bottom:8px}
.ech li.soon{border-left-color:var(--amber)}
.ech li.done{border-left-color:var(--pine)}
.ech strong{font-weight:650}
.ech .small{margin:2px 0 0;color:var(--muted);font-size:13px}
.tag{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.c-area{fill:var(--pine);opacity:.14}
.c-line{fill:none;stroke:var(--pine);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.c-inv{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.c-dot{fill:var(--pine)}
.c-lbl{fill:var(--muted);font:12px var(--txt)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:14px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.key{display:inline-block;width:14px;height:0;border-top:2.4px solid var(--pine);vertical-align:middle;margin-right:6px}
.key.inv{border-top:1.5px dashed var(--muted)}
.stack{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.rep{list-style:none;padding:0;margin:14px 0 0}
.rep li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rep li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:3px}
.rep .p{color:var(--muted);min-width:44px;text-align:right}
.alerts{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.alerts li{display:flex;align-items:flex-start;gap:8px;padding:12px 6px 12px 16px;border-radius:14px;background:var(--surface);border-left:4px solid var(--pine);font-size:15px;touch-action:pan-y;will-change:transform}
.alerts .atxt{flex:1}
.adismiss{flex:0 0 auto;width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:19px;line-height:1;display:grid;place-items:center;margin:-3px 0 0}
.alerts li.warn{border-left-color:var(--amber)}
.alerts li.good{border-left-color:var(--c-av)}
.empty{padding:26px 0}
.empty p{max-width:34ch}

/* Saisie */
.steps{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.steps li button{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border:0;border-radius:18px;background:var(--surface);text-align:left;color:inherit}
.steps li.ok button{background:transparent;border:1px solid var(--line)}
.stepno{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pine-soft);color:var(--pine);font-weight:700;font-size:15px}
.steps li.ok .stepno{background:var(--pine);color:var(--on-pine)}
.stepmain{flex:1;display:grid;gap:2px;min-width:0}
.stept{font-weight:650;font-size:16px}
.stepd{color:var(--muted);font-size:14px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.month-sub{margin:14px 0 0;color:var(--muted);font-size:15px}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.month-nav strong{font:650 19px var(--num)}
.month-nav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.month-nav button:disabled{opacity:.35}
.acc{border:0;margin:0;padding:16px 0;border-bottom:1px solid var(--line)}
.acc legend{display:flex;justify-content:space-between;width:100%;padding:0;margin-bottom:10px}
.acc-name{font-weight:650}
.acc-type{color:var(--muted);font-size:14px}
.acc-fields{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.actions{display:grid;gap:10px;margin-top:22px}
.explain{font-size:14px;color:var(--muted);margin:12px 0 0}

/* Objectifs */
.goal{padding:18px;border-radius:22px;background:var(--surface)}
.goal .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;align-items:end}
.goal .fields .full{grid-column:1/-1}
.result{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.result p{margin:0 0 6px}
.big{font:700 28px/1.1 var(--num);letter-spacing:-.02em}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:var(--pine)}
.small{font-size:13px;color:var(--muted)}

/* Résumé */
.analysis{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px 14px;margin-bottom:14px}
.analysis h3{font:650 16px var(--num);margin:16px 0 6px}
.analysis p{margin:8px 0}
.analysis ul{margin:8px 0;padding-left:20px}
.analysis li{margin:6px 0}
.analysis .small{color:var(--muted);margin-top:14px}
.summary{white-space:pre-wrap;font:15px/1.55 var(--txt);background:var(--surface);border-radius:18px;padding:16px;margin:0;border:1px solid var(--line);user-select:text;-webkit-user-select:text}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{position:relative;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--pine)}
.badge{position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--amber)}

/* Feuille modale */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(10,18,14,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90dvh;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;will-change:transform;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + var(--safe-b));max-width:560px;margin:0 auto;animation:up .22s ease-out}
.sheet .grab{position:relative;height:22px;margin:-4px 0 6px;touch-action:none;cursor:grab}
.sheet .grab::after{content:'';position:absolute;left:50%;top:8px;transform:translateX(-50%);width:40px;height:5px;border-radius:9px;background:var(--line)}
.sheet h2{font:700 22px var(--num);margin:4px 0 14px}
.sheet h3{font:650 16px var(--num);margin:26px 0 10px}
.sheet .stack-form{display:grid;gap:12px}
.list{list-style:none;margin:0;padding:0}
.list li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit}
.menu li button{padding:15px 2px;font-weight:650}
.menu .small{font-weight:400;color:var(--muted)}
.list .closed{opacity:.5}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div id="codebar"></div>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<input type="file" id="txfile" accept=".csv,.txt,.tsv,.html,.htm,.ofx,text/plain,text/csv,text/html" hidden>
<input type="file" id="stmtfile" accept=".csv,.txt,.tsv,.html,.htm,text/plain,text/csv,text/html" hidden>
<script>
'use strict';

// L'app ne doit jamais s'afficher dans un cadre : une page tierce pourrait superposer
// des éléments invisibles au-dessus du champ de mot de passe (clickjacking).
// L'en-tête frame-ancestors n'étant pas utilisable en balise meta, on le vérifie ici.
if (window.top !== window.self) {
  document.documentElement.textContent = 'Cette application ne peut pas s’afficher dans un cadre. Ouvre-la directement depuis son adresse.';
  throw new Error('framed');
}

/* ---------- Référentiel ---------- */
const ITER = 600000;            // itérations PBKDF2
const LOCK_MS = 2 * 60 * 1000;  // verrouillage après 2 min en arrière-plan

const TYPES = {
  livretA: { label: 'Livret A', cat: 'livrets', plafond: 22950 },
  ldds:    { label: 'LDDS', cat: 'livrets', plafond: 12000 },
  lep:     { label: 'LEP', cat: 'livrets', plafond: 10000 },

let persistent = true;

function idbStore(db) {
  const os = mode => db.transaction('kv', mode).objectStore('kv');
  const wrap = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return { get: k => wrap(os('readonly').get(k)), set: (k, v) => wrap(os('readwrite').put(v, k)), del: k => wrap(os('readwrite').delete(k)) };
}
async function openStore() {
  try {
    const db = await Promise.race([
      new Promise((res, rej) => {
        const r = indexedDB.open('patrimoine', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000)),
    ]);
    const s = idbStore(db);
    await s.set('_probe', 1); await s.del('_probe');
    return s;
  } catch (e) { persistent = false; return memStore; }
}
// Délai croissant après 5 mots de passe erronés (30 s, 1 min, 2 min… jusqu'à 15 min)

/* ---------- Chiffrement ----------
   Les données sont chiffrées (AES-GCM 256) avec une clé maître aléatoire.
   Cette clé maître est elle-même chiffrée dans des « emplacements » :
   - pw : clé dérivée du mot de passe (PBKDF2-SHA256, 600 000 itérations) ;
   - pk : clé dérivée d'une clé d'accès grâce à l'extension WebAuthn PRF (Face ID).
   Changer le mot de passe ne rechiffre que la clé maître. */
const enc = new TextEncoder(), dec = new TextDecoder();
const rand = n => crypto.getRandomValues(new Uint8Array(n));
function b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const importDek = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function aesEnc(k, bytes) { const iv = rand(12); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, bytes); return { iv: b64(iv), ct: b64(ct) }; }
async function aesDec(k, iv, ct) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, k, unb64(ct))); }
async function pwKek(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function prfKek(secret) {
  const base = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: enc.encode('patrimoine'), info: enc.encode('cle-d-acces-v2') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function makePwSlot(raw, pass) { const salt = rand(16); return { salt: b64(salt), iter: ITER, ...(await aesEnc(await pwKek(pass, salt, ITER), raw)) }; }
const openPwSlot = async (slot, pass) => aesDec(await pwKek(pass, unb64(slot.salt), slot.iter), slot.iv, slot.ct);
async function seal() {
  const w = await aesEnc(dek, enc.encode(JSON.stringify(S)));
  return { app: 'patrimoine', v: 2, slots, ...w, savedAt: Date.now() };
}
// Ouvre le coffre (ou une sauvegarde) avec le mot de passe ou le secret d'une clé d'accès.
async function openVault(vault, { pass, prf }) {
  if (!vault.slots) { // ancien format v1 : converti au passage
    const data = JSON.parse(dec.decode(await aesDec(await pwKek(pass, unb64(vault.salt), vault.iter), vault.iv, vault.ct)));
    const raw = rand(32);
    return { raw, data, slots: { pw: await makePwSlot(raw, pass) }, migrated: true };
  }
  const raw = prf ? await aesDec(await prfKek(prf), vault.slots.pk.iv, vault.slots.pk.ct) : await openPwSlot(vault.slots.pw, pass);
  const data = JSON.parse(dec.decode(await aesDec(await importDek(raw), vault.iv, vault.ct)));
  return { raw, data, slots: vault.slots };
}
async function adopt(o) { dekRaw = o.raw; dek = await importDek(o.raw); slots = o.slots; S = normalize(o.data); mode = 'app'; }
function wipeKeys() { dekRaw?.fill(0); dekRaw = null; dek = null; slots = null; S = null; }

/* ---------- Clé d'accès : Face ID via le trousseau iCloud ou un gestionnaire compatible ---------- */
const pkAvailable = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
function pkError(e) {
  if (e?.message === 'noprf') return 'Ce gestionnaire de clés d’accès ne permet pas de déverrouiller l’app (extension PRF non prise en charge). Supprime la clé créée dans ce gestionnaire, puis réessaie en l’enregistrant ailleurs, par exemple dans le trousseau iCloud.';
  if (e?.name === 'NotAllowedError') return 'Opération annulée ou expirée.';
  if (e?.name === 'SecurityError') return 'Les clés d’accès ne fonctionnent qu’à l’adresse https de l’app installée.';
  return 'La clé d’accès n’a pas pu être utilisée.';
}
async function prfGet(slot) {
  const cred = await navigator.credentials.get({ publicKey: {
    challenge: rand(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
    allowCredentials: [{ type: 'public-key', id: unb64(slot.credId) }],
    extensions: { prf: { eval: { first: unb64(slot.prfSalt) } } } } });
  const r = cred.getClientExtensionResults()?.prf?.results?.first;
  if (!r) throw new Error('noprf');
  return new Uint8Array(r);
}
async function pkCreate() {
  const prfSalt = rand(32);
  const cred = await navigator.credentials.create({ publicKey: {
    rp: { name: 'Patrimoine', id: location.hostname },
    user: { id: rand(16), name: 'Patrimoine', displayName: 'Patrimoine' },
    challenge: rand(32),
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { residentKey: 'required', requireResidentKey: true, userVerification: 'required' },
    timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
  const ext = cred.getClientExtensionResults()?.prf;
  if (ext && ext.enabled === false) throw new Error('noprf');
  return { slot: { credId: b64(cred.rawId), prfSalt: b64(prfSalt) }, secret: ext?.results?.first ? new Uint8Array(ext.results.first) : null };
}
async function pkStore(slot, secret) {
  slots = { ...slots, pk: { ...slot, ...(await aesEnc(await prfKek(secret), dekRaw)), createdAt: Date.now() } };
  await save();
}

/* ---------- Masquage des montants ----------
   Masquer est immédiat ; démasquer demande Face ID ou le mot de passe. */
const sameBytes = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);
async function setMasked(v) {
  masked = v;
  if (mode === 'app') { S.settings.masked = v; await save(); }
  else if (S) S.settings.masked = v;
  closeSheet(); render(); window.scrollTo(0, 0);
}
async function askUnmask() {
  if (mode !== 'app') return setMasked(false);
  if (slots?.pk && pkAvailable()) {
    try {
      const raw = await aesDec(await prfKek(await prfGet(slots.pk)), slots.pk.iv, slots.pk.ct);
      if (!sameBytes(raw, dekRaw)) throw new Error('mismatch');
      return setMasked(false);
    } catch (e) { return sheetUnmask(e.name === 'NotAllowedError' ? null : pkError(e)); }
  }
  sheetUnmask();
}

/* ---------- Vérification du code de l'app ----------
   Le service worker sert toujours la version mise en cache : le code ne change
   jamais tout seul. À chaque démarrage, l'app calcule l'empreinte du code servi,
   la compare à celle que tu as approuvée, et te signale toute différence. */
const CACHE_NAME = 'patrimoine-v3';
const SHELL = ['./', './index.html', './sw.js', './manifest.webmanifest', './icon-180.png', './icon-192.png', './icon-512.png'];
const CODE_FILES = ['./index.html', './sw.js'];
let code = { status: 'unknown', served: null, approved: null, net: null, at: null, err: null, checked: null };
const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
const fpLabel = h => h ? hex(unb64(h).slice(0, 8)).toUpperCase().match(/.{4}/g).join(' ') : '—';
async function fpOf(fresh) {
  const parts = [];
  for (const f of CODE_FILES) {
    // Le paramètre « fresh » est laissé passer par le service worker, et l'horodatage
    // empêche le cache du navigateur ou du CDN de renvoyer une version périmée.
    const r = await fetch(fresh ? `${f}?fresh=${Date.now()}` : f, { cache: 'no-store' });
    if (!r.ok) throw new Error('Réponse ' + r.status + ' pour ' + f);
    parts.push(await r.text());
  }
  return b64(await crypto.subtle.digest('SHA-256', enc.encode(parts.join('\u0000'))));
}
async function checkCode() {
  if (!window.isSecureContext) { code.err = 'Vérification indisponible hors https.'; return; }
  try { code.served = await fpOf(false); } catch (e) { code.err = e.message; return; }
  const saved = await store.get('code');
  if (!saved || saved.pending) {
    // Première ouverture, ou retour d'une mise à jour que tu viens d'approuver.
    await store.set('code', { fp: code.served, at: Date.now() });
    code.approved = code.served; code.at = Date.now(); code.status = 'ok';
  } else {
    code.approved = saved.fp; code.at = saved.at;
    code.status = saved.fp === code.served ? 'ok' : 'changed';
  }
  paintCode();
  if (code.status === 'ok') checkNetwork();
}
async function checkNetwork(manual) {
  if (!window.isSecureContext) return false;
  if (navigator.onLine === false) { code.err = 'Pas de connexion réseau.'; return false; }
  try { code.net = await fpOf(true); code.err = null; code.checked = Date.now(); }
  catch (e) { code.err = e.message; return false; }
  if (code.net !== code.approved && code.status !== 'changed') { code.status = 'update'; paintCode(); }
  return code.net !== code.approved;
}
function paintCode() {
  const el = $('#codebar'); if (!el) return;
  if (code.status === 'update') el.innerHTML = `<div class="codebar"><p>Une nouvelle version du code de l’app est disponible en ligne. Si tu n’en es pas à l’origine, ne l’installe pas.</p>
    <div class="row"><button class="btn primary" data-act="codeupdate">Installer la mise à jour</button><button class="btn" data-act="codeinfo">Détails</button><button class="btn" data-act="codelater">Plus tard</button></div></div>`;
  else if (code.status === 'changed') el.innerHTML = `<div class="codebar bad"><p><strong>Le code de l’app a changé</strong> sans que tu l’aies approuvé. Ne saisis pas ton mot de passe avant d’avoir vérifié.</p>
    <div class="row"><button class="btn" data-act="codeinfo">Que faire ?</button></div></div>`;
  else el.innerHTML = '';
}
// Remise à zéro du code installé : on supprime le service worker et ses caches,
// puis on recharge depuis le réseau. Les données du coffre (IndexedDB) ne sont pas touchées.
async function applyCodeUpdate() {
  if (!confirm('Installer cette version du code ? À ne faire que si tu viens de mettre les fichiers à jour toi-même.\n\nTes données ne sont pas touchées.')) return;
  const btn = $('#codebar .btn.primary'); if (btn) { btn.disabled = true; btn.textContent = 'Installation…'; }
  try {
    await store.set('code', { fp: code.net, at: Date.now(), pending: true });
    for (const r of await navigator.serviceWorker?.getRegistrations() || []) await r.unregister();
    for (const k of await caches.keys()) await caches.delete(k);
    location.replace(location.pathname + '?u=' + Date.now());
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Installer la mise à jour'; }
    toast('Mise à jour impossible : ' + (e.message || 'réessaie avec du réseau'));
  }
}
function sheetCode() {
  const changed = code.status === 'changed';
  openSheet(`<h2>${changed ? 'Code modifié' : 'Vérification du code'}</h2>
    <p class="small" style="margin:0 0 14px">L’empreinte est un condensé du code de l’app. Elle ne change que si le code change.</p>
    <p>Approuvée${code.at ? ' le ' + new Date(code.at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : ''}<br><span class="fp">${fpLabel(code.approved)}</span></p>
    <p>${changed ? 'Code actuellement servi' : 'Version en ligne'}<br><span class="fp">${fpLabel(changed ? code.served : code.net)}</span></p>
    ${changed ? `<p>Si tu viens de modifier les fichiers chez ton hébergeur, c’est normal. Sinon, quelqu’un a peut-être pris le contrôle de ton compte : change son mot de passe et vérifie l’historique du dépôt avant d’ouvrir l’app.</p>
      <button class="btn wide" data-act="codeapprove">Approuver cette version</button>`
      : code.status === 'update' ? '<p>N’installe cette version que si tu viens de mettre les fichiers à jour toi-même.</p><button class="btn primary wide" data-act="codeupdate">Installer la mise à jour</button>'
      : `<p class="small">${code.err ? 'Dernière vérification en échec : ' + esc(code.err) : code.checked ? 'Vérifié à ' + new Date(code.checked).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + ' : la version en ligne est identique.' : 'Pas encore vérifié en ligne.'}</p>
        <button class="btn primary wide" data-act="codecheck">Vérifier maintenant</button>`}
    <button class="btn wide" style="margin-top:10px" data-act="close">Fermer</button>`);
}

/* ---------- Calculs ---------- */
const active = () => S.accounts.filter(a => !a.closed);
// Un compte courant sert au fonctionnement du mois : il est suivi à part du patrimoine.
const isCash = a => !!TYPES[a.type].cash;
const cashAccounts = () => active().filter(isCash);
const isSimple = a => isCash(a) && a.simple;          // enveloppe : on ne suit que ce qui est envoyé
const dotOf = (m, a) => entry(m, a)?.dot || 0;
const txOf = (m, a) => entry(m, a)?.tx || [];
const months = () => Object.keys(S.entries).filter(k => Object.keys(S.entries[k]).length).sort();
const entry = (m, a) => S.entries[m]?.[a.id];
// Versement net du mois : somme des mouvements datés, ou le champ simple si aucun détail
const moveSum = e => e?.moves?.length ? e.moves.reduce((t, m) => t + m.a, 0) : (e?.deposit || 0);

// Un mouvement met à jour le solde : en cours de mois tu vois ce qui reste disponible.
// « auto » indique un solde calculé ; dès que tu saisis un solde différent, il devient manuel

function syncBalance(m, a, delta) {

  if (e.auto || e.value == null) { e.value = base + moveSum(e); e.auto = true; }

}
const dayLabel = (mk, d) => `${d} ${monthName(mk)}`;
function firstMonthOf(a) { for (const k of months()) if (S.entries[k][a.id]?.value != null) return k; return null; }
function lastUpdate(a) { const ms = months(); for (let i = ms.length - 1; i >= 0; i--) if (S.entries[ms[i]][a.id]?.value != null) return ms[i]; return null; }
function valueAt(a, m) {

}
const totalAt = (m, f = () => true) => S.accounts.filter(a => !isCash(a) && f(a)).reduce((s, a) => s + valueAt(a, m), 0);

// Décomposition de la variation d’un compte sur un mois : versements, entrée dans le suivi, performance
function accBreak(a, m) {

  if (a.closed && m === addMonths(a.closed, 1)) return { v: 0, p, dep: 0, added: -p, perf: 0 };
  const first = firstMonthOf(a);
  if (!first || first > m) return { v: 0, p: 0, dep: 0, added: 0, perf: 0 };
  if (first === m) return { v, p: 0, dep, added: v - dep, perf: 0 };

function breakdown(m, f = () => true) {

}
// Mois où au moins un compte de patrimoine a une valeur : borne le graphique d'évolution
const patMonths = () => months().filter(k => S.accounts.some(a => !isCash(a) && S.entries[k][a.id]?.value != null));
function timeline(f = () => true) {
  const ms = patMonths(); if (!ms.length) return [];
  const out = []; let inv = 0;
  for (let k = ms[0]; k <= ms[ms.length - 1]; k = addMonths(k, 1)) {

}

  for (let k = from; k <= upto; k = addMonths(k, 1)) { c++; for (const a of S.accounts.filter(a => !isCash(a) && f(a))) sum += dep(k, a); }

const focusMonth = () => { const ms = months(); return ms.length ? ms[ms.length - 1] : monthKey(); };

// Taux moyens des courtiers (Meilleurtaux, Pretto, Cafpi, Empruntis, Vousfinancer), septembre 2026, hors assurance
const LOAN_RATES = { 15: { min: 3.23, max: 3.43, def: 3.35 }, 20: { min: 3.40, max: 3.54, def: 3.47 }, 25: { min: 3.50, max: 3.61, def: 3.55 } };

const loanCfg = () => S.goals.loan;
const tx2 = v => Number(v).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function loanIncome(F, scope) {
  if (!S.household.on || members().length < 2) return S.settings.revenus || 0;
  if (scope === 'foyer') return members().reduce((t, m) => t + incomeOf(F, m.id), 0);

}
// Capacité d'emprunt : mensualité maximale = revenus × taux d'endettement,
// dont il faut retrancher l'assurance, proportionnelle au capital emprunté.
function loanCapacity(revenus, g) {
  const M = Math.max(0, revenus * (g.endettement || 35) / 100);
  const n = (g.duree || 25) * 12;
  const taux = g.taux != null ? g.taux : LOAN_RATES[g.duree || 25].def;
  const i = taux / 100 / 12, a = (g.assurance || 0) / 100 / 12;
  const f = (i > 0 ? i / (1 - Math.pow(1 + i, -n)) : 1 / n) + a;
  const C = f > 0 ? M / f : 0;
  const mensCredit = C * (i > 0 ? i / (1 - Math.pow(1 + i, -n)) : 1 / n);
  return { M, C, taux, n, mensCredit, mensAssur: C * a, cout: mensCredit * n - C, coutAssur: C * a * n };
}
const loanPrice = (C, apport, g) => (C + apport) / (1 + (g.frais || 0) / 100);
function goalApport(F) {
  const g = S.goals.apport; if (!g.target) return null;
  const f = a => a.apport;
  const cur = totalAt(F, f), pace = avgDep(F, 6, f).avg;
  const left = g.date ? monthDiff(F, g.date) : null;
  const r = { cur, pace, left, prog: Math.min(1, cur / g.target), need: null, reach: null, late: null, done: cur >= g.target };
  if (r.done) return r;
  if (left != null && left > 0) r.need = (g.target - cur) / left;
  if (pace > 0) { r.reach = addMonths(F, Math.ceil((g.target - cur) / pace)); if (g.date) r.late = monthDiff(g.date, r.reach); }
  return r;
}

  const g = S.goals.rente; if (!g.birthYear || !g.retireAge) return null;
  const f = a => a.retraite;
  const C = totalAt(F, f), m = Math.max(0, avgDep(F, 6, f).avg);
  const [y, mo] = F.split('-').map(Number);

  return { C, m, n, fv, rente: fv * w / 12, target, need, age: g.retireAge };

/* ---------- Foyer : répartition des charges ---------- */
const members = () => S.household.members;
const memberOf = id => members().find(m => m.id === id) || members()[0];
const mName = id => memberOf(id).name;
// Étiquette neutre pour le résumé envoyé à l'IA : aucun prénom n'en sort
const mLabel = id => id === 'moi' ? 'moi' : members().length === 2 ? 'mon conjoint' : 'membre ' + (members().findIndex(m => m.id === id) + 1);
const potOf = m => S.pot[m] || { items: [], transfers: [] };
// Les dépenses marquées « fixe » sont reprises d'office le mois suivant, une seule fois :
// si tu en supprimes une, elle ne revient pas.
async function seedMonth(k) {
  if (S.pot[k]?.seeded) return 0;
  const prevK = addMonths(k, -1), rec = potOf(prevK).items.filter(i => i.r !== false);
  const cur = (S.pot[k] ||= { items: [], transfers: [] });
  cur.transfers ||= [];
  if (!rec.length) { if (S.pot[k].items.length) cur.seeded = true; return 0; }
  const have = new Set(cur.items.map(i => norm(i.n)));
  let n = 0;
  for (const i of rec) if (!have.has(norm(i.n))) { cur.items.push({ id: uid(), n: i.n, a: i.a, by: i.by, r: true }); n++; }
  cur.seeded = true; cur.from = prevK;
  await save();
  return n;
}
// Dépenses communes du mois : saisies à la main, opérations de compte courant classées « charge », enveloppes
function potItems(k) {
  const out = potOf(k).items.map(i => ({ ...i }));
  for (const a of cashAccounts().filter(x => x.potCharge)) {
    if (isSimple(a)) { const d = dotOf(k, a); if (d > 0) out.push({ id: 'env:' + a.id, n: a.name, a: d, by: a.owner || 'moi', src: 'env', accId: a.id }); continue; }
    for (const t of txOf(k, a)) if (t.c === 'charge' && t.a < 0) out.push({ id: 'tx:' + t.id, n: t.n, a: -t.a, by: a.owner || 'moi', src: 'tx', accId: a.id });
  }

}
// Revenu du mois : valeur saisie pour ce mois, sinon le revenu de référence du membre
const incomeSet = (k, id) => S.pot[k]?.inc?.[id] != null;
const incomeOf = (k, id) => (S.pot[k]?.inc?.[id] ?? memberOf(id).income) || 0;
const incomeMissing = k => S.household.on && S.household.split.mode === 'revenus' && members().filter(m => !incomeSet(k, m.id));
function shares(k) {
  const H = S.household, ms = H.members;
  const from = vals => { const t = vals.reduce((a, b) => a + b, 0); return t > 0 ? Object.fromEntries(ms.map((m, i) => [m.id, vals[i] / t])) : null; };
  if (H.split.mode === 'revenus') { const r = from(ms.map(m => incomeOf(k, m.id))); if (r) return r; }
  if (H.split.mode === 'manuel') { const r = from(ms.map(m => H.split.shares[m.id] || 0)); if (r) return r; }
  return Object.fromEntries(ms.map(m => [m.id, 1 / ms.length]));
}
function potStats(k) {
  const p = potOf(k), sh = shares(k), items = potItems(k);
  const total = items.reduce((t, i) => t + i.a, 0);
  const paid = {}, due = {}, net = {}, out = {}, inn = {};
  for (const m of members()) {
    paid[m.id] = items.filter(i => i.by === m.id).reduce((t, i) => t + i.a, 0);
    const regs = (p.transfers || []).filter(t => t.reg !== false);
    out[m.id] = regs.filter(t => t.from === m.id).reduce((t, x) => t + x.a, 0);
    inn[m.id] = regs.filter(t => t.to === m.id).reduce((t, x) => t + x.a, 0);
    due[m.id] = total * (sh[m.id] || 0);
    net[m.id] = paid[m.id] + out[m.id] - inn[m.id] - due[m.id];

}
// Qui doit combien à qui, une fois les charges et les virements pris en compte
function settle(st) {
  const pos = members().filter(m => st.net[m.id] > 0.5).sort((a, b) => st.net[b.id] - st.net[a.id]);
  const neg = members().filter(m => st.net[m.id] < -0.5).sort((a, b) => st.net[a.id] - st.net[b.id]);
  const res = []; const left = {};
  pos.forEach(m => left[m.id] = st.net[m.id]); neg.forEach(m => left[m.id] = -st.net[m.id]);
  for (const d of neg) for (const c of pos) {
    if (left[d.id] < 0.5 || left[c.id] < 0.5) continue;
    const a = Math.min(left[d.id], left[c.id]);

  }

function defaultAcc(id) {

}
const accName = id => S.accounts.find(a => a.id === id)?.name || '';
const savedBy = (k, id) => S.accounts.filter(a => !isCash(a) && a.owner === id).reduce((t, a) => t + dep(k, a), 0);

/* ---------- Points d’attention ---------- */
// f : périmètre affiché (une personne ou tout le foyer). mine : ce périmètre inclut-il tes propres comptes,
// pour les alertes qui te concernent personnellement (objectifs, précaution, sauvegarde, revenus du foyer).
function alerts(F, forSummary = false, f = () => true, mine = true) {
  const out = [], cur = monthKey(), [yy, mm] = F.split('-').map(Number);
  const E = forSummary && rounding ? approx : eur;
  const acc = active().filter(f);
  for (const a of acc) {
    const lu = lastUpdate(a);
    if (lu && monthDiff(lu, cur) >= 2 && !forSummary) out.push({ l: 'warn', k: `upd:${a.id}`, s: lu, t: `${a.name} n’a pas été mis à jour depuis ${monthName(lu)}.` });
  }
  for (const a of acc) {
    const T = TYPES[a.type]; if (!T.plafond) continue;
    const v = valueAt(a, F); const nm = forSummary ? T.label : a.name;
    if (v >= T.plafond) out.push({ l: 'info', k: `cap:${a.id}`, s: 'full', t: `${nm} a atteint son plafond de versement (${eur(T.plafond)}) : les prochains versements devront aller sur un autre support.` });
    else if (v >= 0.9 * T.plafond) out.push({ l: 'info', k: `cap:${a.id}`, s: Math.round(v / T.plafond * 20), t: `${nm} est rempli à ${pct(v / T.plafond)} : il reste ${eur(T.plafond - v)} avant le plafond.` });
  }
  for (const a of acc.filter(a => a.type === 'pea')) {
    let versed = 0; const first = firstMonthOf(a);
    for (const k of months()) { if (k > F) break; const e = entry(k, a); if (!e) continue; versed += (k === first ? e.value : moveSum(e)); }
    if (versed > 0.8 * 150000) out.push({ l: 'info', k: `peaverse:${a.id}`, s: Math.round(versed / 1000), t: `${forSummary ? 'PEA' : a.name} : environ ${eur(versed)} versés sur 150 000 € autorisés (estimation depuis le début du suivi).` });
  }
  const pers = acc.filter(a => a.type === 'per');
  if (pers.length && mm >= 9) {
    const y = String(yy);
    const verse = months().filter(k => k.startsWith(y) && k <= F).reduce((s, k) => s + pers.reduce((t, a) => t + dep(k, a), 0), 0);
    if (S.settings.perPlafond) {
      const reste = S.settings.perPlafond - verse;
      if (reste > 0) out.push({ l: 'info', k: 'perplafond', s: Math.round(reste / 100), t: `PER : environ ${E(reste)} de plafond de déduction encore utilisable avant le 31 décembre (${E(verse)} versés cette année).` });
    } else if (!forSummary) out.push({ l: 'info', k: 'pernonrenseigne', s: 'x', t: 'Renseigne ton plafond de déduction PER (sur ton avis d’impôt) dans les réglages pour suivre ce qu’il te reste à déduire cette année.' });
  }
  if (S.settings.depenses && mine) {
    const liv = totalAt(F, a => f(a) && TYPES[a.type].cat === 'livrets'), n = liv / S.settings.depenses;
    if (n < 3) out.push({ l: 'warn', k: 'precaution', s: n.toFixed(1), t: `Épargne de précaution : ${n.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} mois de dépenses sur les livrets, sous les 3 à 6 mois généralement recommandés.` });
    else if (n > 12) out.push({ l: 'info', k: 'precaution', s: Math.round(n), t: `${Math.round(n)} mois de dépenses dorment sur les livrets, à rendement faible : vérifie que c’est voulu (apport à court terme, par exemple).` });
  }
  // Reprises d'épargne en cours de mois
  for (const a of acc) {
    const e = entry(F, a); if (!e?.moves?.length) continue;
    const out_ = movesOut(e); if (!out_) continue;
    const in_ = movesIn(e), last = e.moves.filter(m => m.a < 0).sort((x, y) => y.d - x.d)[0];
    const nm = forSummary ? TYPES[a.type].label : a.name;
    if (in_ > 0) out.push({ l: 'warn', k: `reprise:${a.id}`, s: `${Math.round(in_)}/${Math.round(out_)}`, t: `${nm} : ${E(in_)} versés puis ${E(out_)} repris le ${dayLabel(F, last.d)}${!forSummary && last.n ? ` (${last.n})` : ''}. Épargne nette du mois : ${E(in_ - out_)}.` });
    else out.push({ l: 'warn', k: `reprise:${a.id}`, s: `0/${Math.round(out_)}`, t: `${nm} : retrait de ${E(out_)} le ${dayLabel(F, last.d)}${!forSummary && last.n ? ` (${last.n})` : ''}, sans versement ce mois-ci.` });
  }
  const withdrawMonths = [];
  for (let k = addMonths(F, -5); k <= F; k = addMonths(k, 1)) if (acc.some(a => movesOut(entry(k, a)) > 0)) withdrawMonths.push(k);

  const miss = mine ? incomeMissing(F) : null;

    out.push({ l: 'warn', k: 'revenusmanquants', s: miss.map(m => m.id).join(','), t: `Revenus de ${monthName(F)} non saisis pour ${forSummary ? miss.map(m => mLabel(m.id)).join(', ') : miss.map(m => m.name).join(', ')} : la répartition des charges utilise le revenu de référence.` });

    if (todo && !forSummary) out.push({ l: 'info', k: `txtodo:${a.id}`, s: todo, t: `${a.name} : ${plural(todo, 'opération non classée', 'opérations non classées')} en ${monthName(F)}. Classe-les pour que les charges communes soient justes.` });
  }

    else if (prev.n >= 2 && prev.avg > 0 && b.dep > 1.3 * prev.avg) out.push({ l: 'good', k: 'epargneforte', s: Math.round(b.dep / 50), t: `Bon mois : ${E(b.dep)} épargnés, au-dessus de ta moyenne récente (${E(prev.avg)} par mois).` });
  }
  const ga = mine ? goalApport(F) : null;
  if (ga && !ga.done && ga.late > 0) out.push({ l: 'warn', k: 'apportretard', s: ga.late, t: `Apport immobilier : au rythme actuel, objectif atteint en ${monthLabel(ga.reach)}, soit ${plural(ga.late, 'mois', 'mois')} après l’échéance.` });
  if (ga && !ga.done && ga.pace <= 0 && ga.cur < S.goals.apport.target) out.push({ l: 'warn', k: 'apportzero', s: 'x', t: 'Apport immobilier : aucun versement récent sur les comptes comptés pour l’apport.' });
  const unlockable = acc.filter(a => ['pee', 'per', 'percol'].includes(a.type) && !a.apport);
  if (mine && S.goals.apport.target && unlockable.length && !forSummary)
    out.push({ l: 'info', k: 'deblocage', s: unlockable.length, t: `${[...new Set(unlockable.map(a => TYPES[a.type].label))].join(', ')} : déblocage anticipé possible pour acheter ta résidence principale. Si c’est ton projet, compte-les dans l’apport depuis les réglages.` });
  if (mode === 'app' && !forSummary && mine) {
    const le = S.settings.lastExport, days = le ? Math.floor((Date.now() - le) / 864e5) : null;
    if (days == null) out.push({ l: 'warn', k: 'sauvegarde', s: 'none', t: 'Aucune sauvegarde exportée : si tu perds ou changes d’iPhone, tes données seront perdues.' });
    else if (days > 35) out.push({ l: 'warn', k: 'sauvegarde', s: Math.round(days / 7), t: `Dernière sauvegarde il y a ${days} jours. Pense à en exporter une nouvelle.` });
  }
  const order = { warn: 0, info: 1, good: 2 };
  return out.sort((a, b) => order[a.l] - order[b.l]);
}

// Un point d'attention masqué revient si sa situation change (signature différente),
// si le mois suivi change, ou dès le 1er du mois civil suivant.
function isHidden(x, F) {
  const d = S.dismissed?.[x.k];
  return !!d && d.s === String(x.s) && d.m === F && d.c === monthKey();
}
async function dismissAlert(k, sig) {
  S.dismissed ||= {};
  S.dismissed[k] = { s: String(sig), m: focusMonth(), c: monthKey() };
  const old = addMonths(monthKey(), -2);
  for (const [key, d] of Object.entries(S.dismissed)) if (d.c < old) delete S.dismissed[key];
  await save(); render();
}

/* ---------- Résumé mensuel ---------- */
function summary(F) {
  const R = v => rounding ? approx(v) : eur(v);
  const SR = v => (v > 0.5 ? '+' : v < -0.5 ? '−' : '') + R(Math.abs(v));
  const mineF = a => (a.owner || 'moi') === 'moi';          // le résumé reste ton périmètre personnel
  const ms = months(), b = breakdown(F, mineF), L = [];
  L.push(`Résumé de mes finances : ${monthLabel(F)}`);
  L.push(`Suivi personnel${rounding ? ', montants arrondis' : ''}, sans nom d’établissement.`);
  L.push('');
  const delta = b.total - b.prevTotal;
  if (ms[0] === F) L.push(`Patrimoine suivi : ${R(b.total)} (premier mois de suivi).`);
  else {
    L.push(`Patrimoine suivi : ${R(b.total)} (${b.prevTotal ? spct(delta / b.prevTotal) + ' sur le mois, soit ' : ''}${SR(delta)}).`);
    let d = `Détail de la variation : versements nets ${SR(b.dep)}, performance et intérêts ${SR(b.perf)}`;
    if (Math.abs(b.added) > 1) d += `, comptes ajoutés ou retirés du suivi ${SR(b.added)}`;
    L.push(d + '.');
    const from = monthDiff(ms[0], F) >= 12 ? addMonths(F, -12) : ms[0];
    const tl = timeline(mineF), a0 = tl.find(p => p.k === from), a1 = tl.find(p => p.k === F);
    if (a0 && a1) L.push(`${monthDiff(from, F) === 12 ? 'Sur 12 mois' : 'Depuis ' + monthLabel(from)} : ${SR(a1.t - a0.t)}, dont ${R(a1.inv - a0.inv)} versés.`);
  }
  const prev = avgDep(addMonths(F, -1), 6, mineF);
  const mine = S.accounts.filter(mineF);
  const gin = mine.reduce((t, a) => t + movesIn(entry(F, a)), 0), gout = mine.reduce((t, a) => t + movesOut(entry(F, a)), 0);
  L.push(`Épargne du mois : ${R(b.dep)}${gout > 0 ? ` (${R(gin)} versés, ${R(gout)} repris en cours de mois)` : ''}${prev.n >= 2 ? ` — moyenne des ${prev.n} mois précédents : ${R(prev.avg)} par mois` : ''}.`);
  if (S.settings.revenus) L.push(`Taux d’épargne : ${pct(b.dep / S.settings.revenus)} des revenus nets mensuels.`);
  if (S.settings.depenses) L.push(`Épargne de précaution : ${(totalAt(F, a => mineF(a) && TYPES[a.type].cat === 'livrets') / S.settings.depenses).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} mois de dépenses sur les livrets.`);
  L.push('', 'Répartition :');
  for (const [c, C] of Object.entries(CATS)) {
    const v = totalAt(F, a => mineF(a) && TYPES[a.type].cat === c); if (v <= 0) continue;
    let extra = '';
    if (c === 'livrets') {
      const parts = active().filter(a => mineF(a) && TYPES[a.type].plafond).map(a => { const x = valueAt(a, F) / TYPES[a.type].plafond; return `${TYPES[a.type].label} ${x >= 1 ? 'au plafond' : 'rempli à ' + pct(x)}`; });
      if (parts.length) extra = ` (${parts.join(', ')})`;
    }
    L.push(`- ${C.label} : ${pct(v / b.total)}, ${R(v)}${extra}`);
  }
  const notUpd = active().filter(a => mineF(a) && !isCash(a) && firstMonthOf(a) && firstMonthOf(a) <= F && entry(F, a)?.value == null);
  const market = ['pea', 'cto', 'av', 'per', 'pee', 'percol'].filter(t => S.accounts.some(a => mineF(a) && a.type === t && entry(F, a)?.value != null && valueAt(a, F) > 0));
  if (market.length && ms[0] !== F) {
    L.push('', 'Performance du mois hors versements :');
    for (const t of market) {
      const bb = breakdown(F, a => mineF(a) && a.type === t);
      L.push(`- ${TYPES[t].label} : ${bb.prevTotal ? spct(bb.perf / bb.prevTotal) : 'n. d.'} (${SR(bb.perf)})`);
    }
  }
  if (notUpd.length) L.push('', `Pas encore mis à jour ce mois-ci (valeur du mois précédent reprise) : ${[...new Set(notUpd.map(a => TYPES[a.type].label))].join(', ')}.`);
  const ga = goalApport(F), gr = goalRente(F);
  if (ga || gr) L.push('', 'Objectifs :');
  if (ga) {
    const g = S.goals.apport;
    let t = `- Apport immobilier : ${pct(ga.prog)} de ${R(g.target)} visés${g.date ? ' pour ' + monthLabel(g.date) : ''}.`;
    if (!ga.done) { t += ` Rythme actuel ${R(ga.pace)} par mois`; if (ga.need) t += `, il faudrait ${R(ga.need)} par mois pour tenir l’échéance`; t += '.'; }
    L.push(t);
  }
  if (gr) {
    const g = S.goals.rente;
    let t = `- Retraite : capital actuel ${R(gr.C)}, versements ${R(gr.m)} par mois. Projection à ${gr.age} ans : ${R(gr.fv)} (hypothèse ${String(g.ret).replace('.', ',')} % par an net d’inflation, retrait ${String(g.withdraw).replace('.', ',')} % par an), soit une rente d’environ ${R(gr.rente)} par mois`;
    if (g.monthly) t += ` pour ${R(g.monthly)} visés`;
    L.push(t + '.');
  }
  if (S.household.on && members().length > 1) {
    const st = potStats(F), SPL = { moitie: 'parts égales', revenus: 'au prorata des revenus', manuel: 'parts choisies' };
    if (st.total > 0) {
      L.push('', `Charges communes du foyer : ${R(st.total)}, réparties ${SPL[S.household.split.mode]}.`);
      for (const m of members()) L.push(`- ${mLabel(m.id)} : part ${pct(st.sh[m.id] || 0)}, payé ${R(st.paid[m.id])}, dû ${R(st.due[m.id])}${incomeOf(F, m.id) ? `, soit ${pct(st.due[m.id] / incomeOf(F, m.id))} de ses revenus` : ''}`);
      const d = settle(st);
      if (d.length) d.forEach(x => L.push(`- Régularisation attendue : ${mLabel(x.from)} doit ${R(x.a)} à ${mLabel(x.to)}`));
      else L.push('- Comptes équilibrés entre les membres ce mois-ci.');
    }
    const others = members().filter(m => m.id !== 'moi');
    if (others.some(m => totalAt(F, x => x.owner === m.id) > 0))
      L.push('', `Patrimoine par personne : ${[['moi', totalAt(F, x => (x.owner || 'moi') === 'moi')], ...others.map(m => [mLabel(m.id), totalAt(F, x => x.owner === m.id)])].map(([n, v]) => `${n} ${R(v)}`).join(', ')}.`);
  }
  const cash = cashAccounts().filter(mineF);
  if (cash.length) {
    const lines = [];
    for (const a of cash.filter(x => !isSimple(x))) {
      const deb = txOf(F, a).filter(t => t.a < 0); if (!deb.length) continue;
      const ch = deb.filter(t => t.c === 'charge').reduce((t, x) => t - x.a, 0), ho = deb.filter(t => t.c === 'hors').reduce((t, x) => t - x.a, 0);
      lines.push(`- Compte courant : ${R(ch + ho)} de dépenses réelles, dont ${R(ch)} de charges communes et ${R(ho)} hors charges (virements internes exclus)`);
    }
    const env = cash.filter(isSimple).map(a => ({ a, d: dotOf(F, a) })).filter(x => x.d > 0);
    if (env.length) lines.push(`- Enveloppes envoyées : ${env.map(x => `${x.a.name} ${R(x.d)}`).join(', ')}`);
    if (lines.length) { L.push('', 'Compte courant et enveloppes :'); lines.forEach(l => L.push(l)); }
  }
  const comp = active().filter(a => mineF(a) && a.lines?.length && valueAt(a, F) > 0);
  if (comp.length) {
    L.push('', 'Composition des comptes (dernier relevé importé) :');
    for (const a of comp) {
      const tot = a.lines.reduce((t, l) => t + l.v, 0) || 1;
      const top = a.lines.slice().sort((x, y) => y.v - x.v).slice(0, 8);
      L.push(`- ${TYPES[a.type].label} : ${top.map(l => `${l.n} ${pct(l.v / tot)}`).join(', ')}`);
    }
  }
  const ech = active().filter(mineF).map(a => ({ a, m: maturityOf(a) })).filter(x => x.m && monthDiff(F, x.m.date) > 0 && monthDiff(F, x.m.date) <= 12);
  if (ech.length) { L.push('', 'Échéances fiscales dans les 12 mois :'); ech.forEach(({ a, m }) => L.push(`- ${TYPES[a.type].label} : ${m.years} ans en ${monthLabel(m.date)}`)); }
  const al = alerts(F, true, mineF, true);
  if (al.length) { L.push('', 'Points d’attention repérés par l’app :'); al.forEach(x => L.push('- ' + x.t)); }
  L.push('', 'Ma question : d’après ce résumé, à quoi dois-je faire attention le mois prochain ? Je cherche des points de vigilance et des ajustements concrets, pas de conseil sur de gros placements.');
  return L.join('\n');
}

/* ---------- Rendu principal ---------- */
function render() {

  const tabs = [['home', 'Accueil', ICON.home], ['comptes', 'Comptes', ICON.wallet], ['saisie', 'Ce mois', ICON.edit], ['objectifs', 'Objectifs', ICON.target], ['resume', 'Résumé', ICON.doc]];

    <main class="view">${body}</main>

function vHome() {

  const f = scopeF();
  const F = focusMonth(), b = breakdown(F, f), delta = b.total - b.prevTotal;
  const done = a => isSimple(a) ? entry(cur, a)?.dot != null : entry(cur, a)?.value != null;
  const acc = active().filter(f), missing = acc.filter(a => !done(a)), doneN = acc.length - missing.length;
  const tl = timeline(f), last = tl[tl.length - 1];
  const cats = Object.entries(CATS).map(([c, C]) => ({ c, ...C, v: totalAt(F, a => f(a) && TYPES[a.type].cat === c) })).filter(x => x.v > 0);
  const allAl = alerts(F, false, f, scope === 'moi' || scope === 'all');
  const al = allAl.filter(x => !isHidden(x, F));
  const hiddenN = allAl.length - al.length;
  return `${scopeBar()}
    <section class="hero">
      <p class="hero-month">Fin ${monthLabel(F)}</p>
      <p class="hero-total num">${eur(b.total)}</p>
      <p class="hero-delta ${delta >= 0 ? 'up' : 'down'}">${ms[0] === F ? 'Premier mois de suivi' : `${signed(delta)} sur le mois, dont ${signed(b.dep)} versés`}</p>
    </section>
    ${missing.length ? `
    <section class="update"><div><p class="update-title">${cap(monthName(cur))} à mettre à jour</p><p class="muted">${doneN} ${doneN > 1 ? 'comptes' : 'compte'} sur ${acc.length}</p><div class="progress"><i style="width:${Math.round(doneN / acc.length * 100)}%"></i></div></div>
      <button class="btn primary" data-act="go" data-view="saisie">Mettre à jour</button></section>` : `

function chart(tl) {
  if (tl.length < 2) return '<p class="muted">Le graphique apparaîtra après ta deuxième mise à jour mensuelle.</p>';
  const pts = tl.slice(-13), W = 340, H = 160, pl = 2, pr = 6, pt = 10, pb = 24;
  const vals = pts.flatMap(p => [p.t, p.inv]);
  let lo = Math.min(...vals), hi = Math.max(...vals); const sp = (hi - lo) || hi || 1;
  lo = Math.max(0, lo - sp * 0.25); hi = hi + sp * 0.08;
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1), y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const path = key => pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join('');
  const line = path('t'), n = pts.length - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du patrimoine sur ${pts.length} mois, de ${eur(pts[0].t)} à ${eur(pts[n].t)}">
    <path class="c-area" d="${line}L${x(n).toFixed(1)},${H - pb}L${x(0)},${H - pb}Z"/>
    <path class="c-inv" d="${path('inv')}"/><path class="c-line" d="${line}"/>
    <circle class="c-dot" cx="${x(n).toFixed(1)}" cy="${y(pts[n].t).toFixed(1)}" r="4"/>
    <text class="c-lbl" x="${x(0)}" y="${H - 6}">${monthShort(pts[0].k)}</text>
    <text class="c-lbl" x="${x(n)}" y="${H - 6}" text-anchor="end">${monthShort(pts[n].k)}</text></svg>`;
}

}

function vLoan(F, ga) {
  const g = loanCfg(), R = LOAN_RATES[g.duree] || LOAN_RATES[25];
  const rev = loanIncome(F, g.scope);
  const hh = S.household.on && members().length > 1;
  const scopes = hh ? [['foyer', 'Foyer'], ...members().map(m => [m.id, m.name])] : [];
  if (!rev) return `<section><div class="goal"><h2>Emprunt immobilier</h2>
    <p class="muted">Renseigne ${hh ? 'les revenus du foyer dans Comptes &gt; Foyer' : 'tes revenus nets mensuels dans Réglages &gt; Budget de référence'} pour estimer ta capacité d’emprunt.</p></div></section>`;
  const c = loanCapacity(rev, g);
  const apport = ga ? ga.cur : 0;
  const prix = loanPrice(c.C, apport, g);
  // Projection à l'objectif : apport visé, et revenus éventuellement revalorisés
  const rz = S.settings.raise || {};
  const nMois = S.goals.apport.date ? Math.max(0, monthDiff(F, S.goals.apport.date)) : 0;
  const revObj = rz.on && rz.pct ? rev * Math.pow(1 + rz.pct / 100, nMois / 12) : rev;
  const cObj = loanCapacity(revObj, g);
  const apportObj = S.goals.apport.target || 0;
  const prixObj = loanPrice(cObj.C, apportObj, g);
  const durees = [15, 20, 25];
  return `<section><div class="goal"><h2>Emprunt immobilier</h2>
    ${hh ? `<div class="chips tight">${scopes.map(([v, l]) => `<button class="${g.scope === v ? 'on' : ''}" data-act="loanscope" data-s="${v}">${esc(l)}</button>`).join('')}</div>` : ''}
    <div class="seg seg3" style="margin-top:10px">${durees.map(d => `<button class="${g.duree === d ? 'on' : ''}" data-act="loandur" data-d="${d}">${d} ans</button>`).join('')}</div>
    <p class="small" style="margin:10px 0 0">Taux moyens sur ${g.duree} ans en septembre 2026 : de ${tx2(R.min)} % à ${tx2(R.max)} %.</p>
    <div class="fields" style="margin-top:12px">
      <label>Taux du prêt (%)<input inputmode="decimal" data-loan="taux" value="${esc(numStr(g.taux))}" placeholder="${tx2(R.def)}"></label>
      <label>Assurance (% par an)<input inputmode="decimal" data-loan="assurance" value="${esc(numStr(g.assurance))}"></label>
      <label>Taux d’endettement (%)<input inputmode="decimal" data-loan="endettement" value="${esc(numStr(g.endettement))}"></label>
      <label>Frais de notaire (%)<input inputmode="decimal" data-loan="frais" value="${esc(numStr(g.frais))}"></label>
    </div>
    <div class="result">
      <p class="small" style="margin:0">Revenus pris en compte : ${eur(rev)} par mois${hh ? ` · ${esc(g.scope === 'foyer' ? 'foyer' : mName(g.scope))}` : ''}</p>
      <p class="big num" style="margin:8px 0 2px">${eur(c.C)}</p>
      <p class="small">capacité d’emprunt sur ${g.duree} ans à ${tx2(c.taux)} %</p>
      <ul class="kv">
        <li><span>Mensualité maximale</span><span class="num">${eur(c.M)}</span></li>
        <li><span>dont assurance</span><span class="num">${eur(c.mensAssur)}</span></li>
        <li><span>Coût total du crédit</span><span class="num">${eur(c.cout + c.coutAssur)}</span></li>
        <li><span>Apport disponible</span><span class="num">${eur(apport)}</span></li>
      </ul>
      <p class="big num" style="margin:14px 0 2px">${eur(prix)}</p>
      <p class="small">prix d’achat accessible aujourd’hui, frais de notaire de ${numStr(g.frais)} % inclus</p>
    </div>
    <div class="result">
      <h3 style="font:650 16px var(--num);margin:0 0 8px">Avec ton apport visé${apportObj ? ` de ${eur(apportObj)}` : ''}</h3>
      ${apportObj ? `<ul class="kv">
        ${rz.on && rz.pct && nMois ? `<li><span>Revenus projetés dans ${plural(Math.round(nMois / 12), 'an', 'ans')}</span><span class="num">${eur(revObj)}</span></li>` : ''}
        <li><span>Capacité d’emprunt</span><span class="num">${eur(cObj.C)}</span></li>
        <li><span>Prix d’achat accessible</span><span class="num">${eur(prixObj)}</span></li>
        <li><span>Gain par rapport à aujourd’hui</span><span class="num up">${signed(prixObj - prix)}</span></li>
      </ul>
      ${rz.on && rz.pct ? `<p class="small">Hypothèse d’augmentation de ${numStr(rz.pct)} % par an, activée dans les réglages.</p>`
        : '<p class="small">Tu peux tenir compte d’une augmentation de salaire moyenne dans Réglages &gt; Budget de référence.</p>'}`
      : '<p class="small">Renseigne un montant d’apport visé plus haut pour voir ce que ton projet deviendrait.</p>'}
    </div>
    <p class="small">${esc(LOAN_SRC)} Estimation indicative : seule une banque engage un accord.</p>
  </div></section>`;
}
function vResume() {
  const ms = months();

  const cfg = S.settings.ai;
  return `
    <section style="margin-top:14px"><label>Mois<select id="resmonth">${ms.slice().reverse().map(k => `<option value="${k}" ${k === resumeMonth ? 'selected' : ''}>${cap(monthLabel(k))}</option>`).join('')}</select></label>

function sheetAccountInfo(id) {

  if (simple) [3, 2, 1, 0].map(i => addMonths(F, -i)).forEach(k => kv.push([cap(monthLabel(k, { month: 'long' })), dotOf(k, a) ? eur(dotOf(k, a)) : '—']));
  else if (cash) {
    const deb = txOf(F, a).filter(t => t.a < 0), sum = c => deb.filter(t => t.c === c).reduce((s, t) => s - t.a, 0);
    kv.push(['Charges communes', eur(sum('charge'))], ['Hors charges', eur(sum('hors'))]);
    if (sum('vir')) kv.push(['Virements vers tes comptes', eur(sum('vir'))]);
    kv.push(['Opérations du mois', txOf(F, a).length ? plural(txOf(F, a).length, 'ligne', 'lignes') : 'aucune']);

    ${TAX[a.type] ? `<h3>Fiscalité</h3><ul class="bullets">${TAX[a.type].map(x => `<li>${esc(x)}</li>`).join('')}</ul>

      ${!cash ? `<button class="btn wide" data-act="moves" data-id="${a.id}">Mouvements du mois</button>` : ''}

// Message d'erreur détaillé : le code HTTP seul ne dit pas si c'est la clé, la facturation ou le modèle
async function apiError(r) {
  let detail = '';
  try {
    const t = (await r.text()).slice(0, 400);
    try { const j = JSON.parse(t); detail = j.error?.message || j.message || j.detail || ''; } catch { detail = t; }
  } catch {}
  detail = String(detail).replace(/\s+/g, ' ').trim().slice(0, 140);
  const base = r.status === 401 ? 'Clé refusée (401). Elle est invalide, expirée, ou pas encore active : une clé fraîchement créée met parfois quelques minutes. Vérifie aussi qu’aucune espace ne s’est glissée au collage.'
    : r.status === 402 ? 'Paiement requis (402) : le compte n’a pas d’abonnement ni de moyen de paiement actif.'
    : r.status === 403 ? 'Accès refusé (403) : la clé est valide mais le compte n’a pas de plan actif, ou la clé n’a pas accès à ce modèle.'
    : r.status === 404 ? 'Modèle introuvable (404) : vérifie le nom du modèle dans les réglages.'
    : r.status === 429 ? 'Quota atteint (429) : trop de requêtes, ou crédit épuisé.'
    : r.status >= 500 ? `Service indisponible (${r.status}). Réessaie plus tard.`
    : `Erreur ${r.status}.`;
  return detail ? `${base}\n\nRéponse du service : ${detail}` : base;
}

/* ---------- Compte courant : opérations ----------
   Lecture du relevé sur l'iPhone, puis classement charge / hors charges.
   Les intitulés déjà classés sont mémorisés pour les imports suivants. */
const DATE_RE = /(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})|(\d{4})-(\d{2})-(\d{2})/;
function parseDate(t) {
  const m = String(t).trim().match(DATE_RE); if (!m) return null;
  let y, mo, d;
  if (m[4]) { y = +m[4]; mo = +m[5]; d = +m[6]; }
  else { d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000; }
  if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 2000 || y > 2100) return null;
  return { k: `${y}-${pad(mo)}`, d };
}
function scanTx(txt) {
  let rows;
  if (/<\s*(table|tr|td|html|body|div|span)[\s>]/i.test(txt)) {
    const h = htmlRows(txt);
    rows = (h.rows.length ? h.rows : h.text.split(/\r?\n/).map(l => [l])).slice(0, MAX_LINES);
  } else {
    const lines = txt.split(/\r?\n/).slice(0, MAX_LINES).map(l => l.trim()).filter(Boolean);
    const d = [';', '\t', ',', '|'].map(c => [c, lines.reduce((n, l) => n + (l.split(c).length - 1), 0)]).sort((a, b) => b[1] - a[1])[0];
    rows = d && d[1] >= lines.length ? lines.map(l => splitCsv(l, d[0])) : lines.map(l => [l]);
  }
  const head = rows.length > 1 && !rows[0].some(c => parseDate(c)) ? rows.shift().map(norm) : [];
  const iDeb = head.findIndex(h => /^debit/.test(h)), iCre = head.findIndex(h => /^credit/.test(h));
  const out = [];
  for (const r of rows) {
    let di = -1, dt = null;
    for (let i = 0; i < r.length; i++) { const p = parseDate(r[i]); if (p) { dt = p; di = i; break; } }
    if (!dt) continue;
    let amt = null;
    if (iDeb > -1 || iCre > -1) {
      const deb = iDeb > -1 ? parseAmount(r[iDeb]) : null, cre = iCre > -1 ? parseAmount(r[iCre]) : null;
      if (deb) amt = -Math.abs(deb); else if (cre) amt = Math.abs(cre);
    }
    if (amt == null) for (let i = r.length - 1; i > di; i--) { const v = parseAmount(r[i]); if (v != null && v !== 0) { amt = v; break; } }
    if (amt == null || amt === 0) continue;
    const label = r.filter((c, i) => i !== di && c && parseAmount(c) == null).join(' ').replace(/\s+/g, ' ').trim().slice(0, 60);
    if (!label) continue;
    const nl = norm(label);
    let c = S?.rules?.[nl] || null;
    if (!c && amt < 0 && S?.accounts?.some(x => x.name.length > 3 && nl.includes(norm(x.name)))) c = 'vir';
    out.push({ id: uid(), d: dt.d, k: dt.k, n: label, a: amt, c });
  }
  return out;
}

/* ---------- Import d'un relevé ----------
   L'analyse se fait entièrement sur l'iPhone : le fichier n'est jamais envoyé. */
const KEYS = ['valorisation', 'valeur', 'total', 'epargne', 'encours', 'montant', 'solde', 'rachat', 'atteinte', 'acquise', 'evaluation', 'contre-valeur', 'portefeuille', 'avoirs'];
const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
const NOISE = /(\bnombre\b|\bquantit|\bqte\b|\bqty\b|\bnb\b|\bparts?\b|\bcours\b|\bprix\b|valeur liquidative|\bvl\b|\bpru\b|\bdevise\b|\btaux\b|%|latente|\+\/-|\bisin\b|\bcode\b|\bfrais\b|\bdate\b)/;
function parseAmount(raw) {
  let t = String(raw).replace(/\b(eur|euros?|usd|dollars?|chf)\b/gi, '').replace(/[\s\u00a0\u202f€$]/g, '');
  if (!/\d/.test(t)) return null;
  const neg = /^-/.test(t) || /^\(.+\)$/.test(t);
  t = t.replace(/[()+\-]/g, '');
  if (!/^[\d.,]+$/.test(t)) return null;
  const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  let cut = -1;
  if (lc > -1 && ld > -1) cut = Math.max(lc, ld);
  else { const l = Math.max(lc, ld); if (l > -1 && t.length - l - 1 <= 2) cut = l; }
  const ip = (cut > -1 ? t.slice(0, cut) : t).replace(/[.,]/g, ''), fp = cut > -1 ? t.slice(cut + 1) : '';
  if (!/^\d+$/.test(ip) || (fp && !/^\d+$/.test(fp))) return null;
  const n = Number(ip + (fp ? '.' + fp : ''));
  if (!Number.isFinite(n)) return null;
  if (cut === -1 && /^(19|20)\d\d$/.test(ip)) return null; // millésime, pas un montant
  return neg ? -n : n;
}
function splitCsv(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === d && !q) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(c => c.trim());
}
const scoreOf = txt => KEYS.reduce((sc, w, i) => norm(txt).includes(w) ? sc + (KEYS.length - i) : sc, 0);
// Une page enregistrée ou copiée depuis le site de la banque : on lit les tableaux,
// sinon le texte. DOMParser n'exécute aucun script contenu dans la page.
function htmlRows(txt) {
  const doc = new DOMParser().parseFromString(txt, 'text/html');
  doc.querySelectorAll('script,style,noscript,svg,head').forEach(e => e.remove());
  const rows = [];
  for (const tr of doc.querySelectorAll('tr')) {
    const cells = [...tr.children].map(td => td.textContent.replace(/\s+/g, ' ').trim());
    if (cells.filter(Boolean).length > 1) rows.push(cells);
  }
  return { rows, text: (doc.body?.innerText || doc.body?.textContent || '').replace(/[ \t\u00a0]+/g, ' ') };
}
const MAX_LINES = 20000;   // garde-fou : un fichier anormalement gros ne doit pas figer l'app
function scanStatement(txt) {
  const seen = new Set(), out = [];
  const add = (label, amount, score) => {
    label = label.replace(/[.\u2026_]{3,}/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 70);
    if (!label || amount == null || Math.abs(amount) < 1) return;
    const k = norm(label) + '|' + amount; if (seen.has(k)) return; seen.add(k);
    out.push({ label, amount, score });
  };
  const fromRows = rows => {
    const numeric = r => r.filter(c => parseAmount(c) != null).length;
    const head = rows.length > 1 && numeric(rows[0]) === 0 ? rows.shift() : [];
    for (const r of rows) {
      const label = r.filter(c => c && parseAmount(c) == null).join(' ') || r[0];
      for (let i = 0; i < r.length; i++) {
        const v = parseAmount(r[i]); if (v == null || !r[i]) continue;
        const col = head[i] || '';
        if (col && NOISE.test(norm(col))) continue;
        add(col ? `${label} · ${col}` : label, v, scoreOf(label) * 2 + scoreOf(col) * 3);
      }
    }
  };
  const fromLines = lines => {
    for (const line of lines) {
      const m = line.match(/-?\(?\d[\d\s\u00a0\u202f.,]*\d\)?(?=\s*(?:€|eur|euros?)?\s*$)/i);
      if (!m) continue;
      const before = line[m.index - 1];
      if (before && /[/\-\d]/.test(before)) continue;
      const v = parseAmount(m[0]); if (v == null) continue;
      const label = line.slice(0, m.index);
      if (NOISE.test(norm(label))) continue;
      add(label, v, scoreOf(label) * 2);
    }
  };
  const clean = t => t.split(/\r?\n/).slice(0, MAX_LINES).map(l => l.trim()).filter(l => l && l.length < 400);
  if (/<\s*(table|tr|td|html|body|div|span)[\s>]/i.test(txt)) {
    const h = htmlRows(txt);
    if (h.rows.length) fromRows(h.rows.slice(0, MAX_LINES)); else fromLines(clean(h.text));
  } else {
    const lines = clean(txt);
    const d = [';', '\t', ',', '|'].map(c => [c, lines.reduce((n, l) => n + (l.split(c).length - 1), 0)]).sort((a, b) => b[1] - a[1])[0];
    if (d && d[1] >= lines.length) fromRows(lines.map(l => splitCsv(l, d[0]))); else fromLines(lines);
  }
  return out.sort((x, y) => y.score - x.score || Math.abs(y.amount) - Math.abs(x.amount)).slice(0, 60);
}
// Lignes d'un compte : les montants restants, hors totaux, rattachés par leur intitulé
const TOTALISH = /\btotaux?\b|\btotal\b|versements?|valeur atteinte|valorisation totale|epargne totale/;
function linesFor(a, chosen, single) {
  const rest = cands.map((c, i) => ({ c, i })).filter(({ c, i }) => !chosen.has(i) && c.amount > 0 && !TOTALISH.test(norm(c.label)));
  const n = norm(a.name), t = norm(TYPES[a.type].label);
  const own = rest.filter(({ c }) => { const l = norm(c.label); return l.includes(n) || (t.length > 2 && l.includes(t)); });
  const list = single ? rest : own;
  return list.map(({ c }) => ({ n: c.label.split(' · ')[0].trim().slice(0, 50), v: c.amount }));
}
function guessFor(a, cands) {
  if (a.imp) { const hit = cands.find(c => norm(c.label) === a.imp); if (hit) return cands.indexOf(hit); }
  const t = norm(TYPES[a.type].label), n = norm(a.name);
  const byName = cands.find(c => { const l = norm(c.label); return l.includes(n) || (t.length > 2 && l.includes(t)); });
  if (byName) return cands.indexOf(byName);
  return cands.length === 1 ? 0 : -1;
}

let cands = [];
function sheetImportMap(list) {

// Aperçu du détail des lignes, recalculé à chaque changement de sélection
function paintLines() {
  const sels = $$('#f-map select'), chosen = new Set(sels.filter(s => s.value !== '').map(s => +s.value));
  const single = chosen.size === 1;
  for (const sel of sels) {
    const el = $(`.linehint[data-for="${sel.dataset.map}"]`); if (!el) continue;
    const a = S.accounts.find(x => x.id === sel.dataset.map);
    if (sel.value === '') { el.innerHTML = ''; continue; }
    const lines = linesFor(a, chosen, single), sum = lines.reduce((t, l) => t + l.v, 0), tot = cands[+sel.value].amount;
    if (!lines.length) { el.innerHTML = '<span class="muted">Aucune ligne de détail identifiée pour ce compte.</span>'; continue; }
    const ok = Math.abs(sum - tot) <= Math.max(2, tot * 0.01);
    el.innerHTML = `<label class="check"><input type="checkbox" data-lines="${a.id}" ${ok ? 'checked' : ''}>
      Enregistrer le détail : ${plural(lines.length, 'ligne', 'lignes')}, ${eur(sum)}${ok ? '' : ` — attention, le total du compte est ${eur(tot)}`}</label>`;
  }
}

    toast('Soldes repris, ajuste ceux qui ont changé');
  },
  savesaisie: async () => {
    const m = saisieMonth, out = {}; let bad = null;
    const rows = {};
    $$('#saisie input').forEach(i => { i.classList.remove('bad'); (rows[i.dataset.acc] ||= {})[i.dataset.f] = i; });
    for (const [id, r] of Object.entries(rows)) {
      const acc = S.accounts.find(x => x.id === id), old = entry(m, acc);
      if (r.dot) {
        const dv = num(r.dot.value);
        if (Number.isNaN(dv)) { r.dot.classList.add('bad'); bad ||= r.dot; continue; }
        if (dv != null) out[id] = { dot: dv };
        continue;
      }
      const v = num(r.value.value);
      if (Number.isNaN(v)) { r.value.classList.add('bad'); bad ||= r.value; continue; }
      // Un solde vide ne doit jamais effacer les opérations ou mouvements déjà saisis
      if (isCash(acc)) {
        if (v == null && !old?.tx?.length) continue;
        out[id] = old?.tx?.length ? { value: v ?? old.value ?? null, tx: old.tx } : { value: v };
        continue;
      }
      const d = r.deposit ? num(r.deposit.value) : null;
      if (Number.isNaN(d)) { r.deposit.classList.add('bad'); bad ||= r.deposit; continue; }
      if (v == null) {
        if (d) { r.value.classList.add('bad'); bad ||= r.value; continue; }
        if (old?.moves?.length) out[id] = old.auto ? { value: old.value ?? null, moves: old.moves, auto: true } : { value: old.value ?? null, moves: old.moves };
        continue;
      }
      if (old?.moves?.length) {
        const auto = old.auto && v === old.value;   // solde inchangé : il reste calculé
        out[id] = auto ? { value: v, moves: old.moves, auto: true } : { value: v, moves: old.moves };
      } else out[id] = { value: v, deposit: d || 0 };
    }
    if (bad) { bad.focus(); toast('Vérifie les montants en rouge : un solde est requis pour chaque versement'); return; }
    if (Object.keys(out).length) S.entries[m] = out; else delete S.entries[m];
    await save(); toast(`${cap(monthName(m))} enregistré`); subview = null; render(); window.scrollTo(0, 0);
  },
  copy: async () => {
    const txt = summary(resumeMonth);
    try { await navigator.clipboard.writeText(txt); toast('Résumé copié'); }
    catch { const r = document.createRange(); r.selectNodeContents($('#sumtext')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texte sélectionné : touche Copier'); }
  },
  share: async () => {
    const txt = summary(resumeMonth);
    if (navigator.share) { try { await navigator.share({ text: txt }); } catch (e) { /* annulé */ } } else ACT.copy();
  },
  closeacc: async t => {
    const a = S.accounts.find(x => x.id === t.dataset.id);
    if (a.closed) delete a.closed; else { if (!confirm(`Clôturer « ${a.name} » ? Son historique reste dans les graphiques.`)) return; a.closed = lastUpdate(a) || monthKey(); }
    await save(); sheetSettings(); render();
  },
  delacc: async t => {
    const a = S.accounts.find(x => x.id === t.dataset.id);
    if (!confirm(`Supprimer « ${a.name} » et tout son historique ?`)) return;
    S.accounts = S.accounts.filter(x => x.id !== a.id);
    for (const k of Object.keys(S.entries)) { delete S.entries[k][a.id]; if (!Object.keys(S.entries[k]).length) delete S.entries[k]; }
    await save(); sheetSettings(); render();
  },
};
